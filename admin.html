<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Usuários</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js"></script>
<style>
  :root {
    --ink: #1c2128;
    --paper: #f7f5f0;
    --card: #ffffff;
    --line: #e2ded4;
    --accent: #3a5a49;
    --accent-soft: #e7efe9;
    --warn: #a24030;
    --warn-soft: #f6e8e5;
    --muted: #6b6558;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
  header.top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 28px; flex-wrap: wrap; gap: 10px;
  }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
  .eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 0.9rem; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #2e4a3c; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 6px; }

  /* Login */
  #login-screen {
    max-width: 360px; margin: 15vh auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 32px;
  }
  #login-screen h1 { margin-bottom: 4px; }
  #login-screen p { color: var(--muted); font-size: 0.85rem; margin-top: 0; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 0.9rem; margin-bottom: 12px; font-family: inherit; background: white;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #login-error { color: var(--warn); font-size: 0.82rem; min-height: 18px; }

  /* App */
  #app-screen { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 20px; }
  .card h2 { font-size: 1rem; margin: 0 0 16px; }
  .form-grid { display: grid; grid-template-columns: 1.6fr 1.6fr 1fr auto; gap: 10px; align-items: end; }
  .form-grid label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .form-grid input, .form-grid select { margin-bottom: 0; }
  select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; background: white; font-size: 0.9rem; width: 100%;}

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
  .badge.ativo { background: var(--accent-soft); color: var(--accent); }
  .badge.inativo { background: #eee; color: var(--muted); }
  .badge.expirado { background: var(--warn-soft); color: var(--warn); }
  .row-actions { display: flex; gap: 6px; }
  .link-cell { display: flex; align-items: center; gap: 6px; font-family: monospace; font-size: 0.78rem; color: var(--muted); }
  #empty-state { text-align: center; color: var(--muted); padding: 30px 0; font-size: 0.88rem; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 10px 18px; border-radius: 8px;
    font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="eyebrow">Acesso restrito</div>
  <h1>Controle de Usuários</h1>
  <p>Entre com sua conta de administrador.</p>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username" />
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password" />
  <div id="login-error"></div>
  <button class="btn-primary" style="width:100%" onclick="fazerLogin()">Entrar</button>
</div>

<div id="app-screen">
  <div class="wrap">
    <header class="top">
      <div>
        <div class="eyebrow">Painel de administração</div>
        <h1>Controle de Usuários</h1>
      </div>
      <button class="btn-ghost btn-sm" onclick="fazerLogout()">Sair</button>
    </header>

    <div class="card">
      <h2>Cadastrar novo acesso</h2>
      <div class="form-grid">
        <div>
          <label for="novo-nome">Nome da pessoa</label>
          <input id="novo-nome" type="text" placeholder="Ex: João Silva" />
        </div>
        <div>
          <label for="novo-email">E-mail (Gmail)</label>
          <input id="novo-email" type="email" placeholder="pessoa@gmail.com" />
        </div>
        <div>
          <label for="novo-plano">Plano</label>
          <select id="novo-plano">
            <option value="30 dias">30 dias</option>
            <option value="60 dias">60 dias</option>
            <option value="90 dias">90 dias</option>
            <option value="1 ano">1 ano</option>
          </select>
        </div>
        <button class="btn-primary" onclick="cadastrarUsuario()">Gerar link</button>
      </div>
    </div>

    <div class="card">
      <h2>Usuários cadastrados</h2>
      <table id="tabela-usuarios">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Plano</th>
            <th>Expira em</th>
            <th>Status</th>
            <th>Link</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody-usuarios"></tbody>
      </table>
      <div id="empty-state" style="display:none">Nenhum usuário cadastrado ainda.</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ==== CONFIGURAÇÃO: preencha com os dados do seu projeto Supabase ====
  const SUPABASE_URL = "https://jmogaclwihvsouqixozo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imptb2dhY2x3aWh2c291cWl4b3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTk5MzIsImV4cCI6MjEwMjgzNTkzMn0.kzvlfUAzRrEeb2UGlEViCOVh0vIMuHVkR_EzUSjn87U";
  // URL onde a Página 2 (evangelismo.html) vai ficar publicada no GitHub Pages:
  const URL_PAGINA_EVANGELISMO = "https://SEU-USUARIO.github.io/SEU-REPOSITORIO/evangelismo.html";
  // =======================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  async function checarSessao() {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      carregarUsuarios();
    } else {
      document.getElementById("login-screen").style.display = "block";
      document.getElementById("app-screen").style.display = "none";
    }
  }

  async function fazerLogin() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const errBox = document.getElementById("login-error");
    errBox.textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) {
      errBox.textContent = "E-mail ou senha inválidos.";
      return;
    }
    checarSessao();
  }

  async function fazerLogout() {
    await sb.auth.signOut();
    checarSessao();
  }

  function calcularExpiracao(plano) {
    const dias = { "30 dias": 30, "60 dias": 60, "90 dias": 90, "1 ano": 365 }[plano];
    const data = new Date();
    data.setDate(data.getDate() + dias);
    return data.toISOString();
  }

  function gerarToken() {
    return crypto.randomUUID().replace(/-/g, "");
  }

  async function cadastrarUsuario() {
    const nome = document.getElementById("novo-nome").value.trim();
    const email = document.getElementById("novo-email").value.trim();
    const plano = document.getElementById("novo-plano").value;
    if (!nome) { showToast("Digite o nome da pessoa."); return; }

    const { error } = await sb.from("usuarios_evangelismo").insert({
      nome,
      email: email || null,
      plano,
      token: gerarToken(),
      data_expiracao: calcularExpiracao(plano),
      status: "ativo"
    });

    if (error) { showToast("Erro ao cadastrar: " + error.message); return; }
    document.getElementById("novo-nome").value = "";
    document.getElementById("novo-email").value = "";
    showToast("Usuário cadastrado. Não esqueça de liberar este e-mail como testador no Google Cloud.");
    carregarUsuarios();
  }

  async function alternarStatus(id, statusAtual) {
    const novo = statusAtual === "ativo" ? "inativo" : "ativo";
    const { error } = await sb.from("usuarios_evangelismo").update({ status: novo }).eq("id", id);
    if (error) { showToast("Erro ao atualizar status."); return; }
    carregarUsuarios();
  }

  function copiarLink(token) {
    const link = `${URL_PAGINA_EVANGELISMO}?token=${token}`;
    navigator.clipboard.writeText(link);
    showToast("Link copiado.");
  }

  function formatarData(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR");
  }

  async function carregarUsuarios() {
    const { data, error } = await sb
      .from("usuarios_evangelismo")
      .select("*")
      .order("data_criacao", { ascending: false });

    if (error) { showToast("Erro ao carregar usuários."); return; }

    const tbody = document.getElementById("tbody-usuarios");
    const emptyState = document.getElementById("empty-state");
    tbody.innerHTML = "";

    if (!data.length) {
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    const agora = new Date();

    data.forEach(u => {
      const expirado = new Date(u.data_expiracao) < agora;
      let badgeClass = u.status === "ativo" ? "ativo" : "inativo";
      let badgeText = u.status === "ativo" ? "Ativo" : "Inativo";
      if (expirado && u.status === "ativo") { badgeClass = "expirado"; badgeText = "Expirado"; }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${u.nome}</td>
        <td>${u.email || "<span style='color:var(--muted)'>—</span>"}</td>
        <td>${u.plano}</td>
        <td>${formatarData(u.data_expiracao)}</td>
        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
        <td>
          <div class="link-cell">
            <span>...${u.token.slice(-8)}</span>
            <button class="btn-ghost btn-sm" onclick="copiarLink('${u.token}')">Copiar link</button>
          </div>
        </td>
        <td>
          <div class="row-actions">
            <button class="btn-ghost btn-sm" onclick="alternarStatus('${u.id}', '${u.status}')">
              ${u.status === "ativo" ? "Inativar" : "Ativar"}
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  checarSessao();
</script>
</body>
</html>
