<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu saldo de pontos</title>
<meta name="theme-color" content="#1a5fb4">
<script>
  // Esta página é aberta pelo participante, que nunca passou pelo painel e
  // portanto não escolheu tema nenhum. Então ela segue o aparelho dele.
  (function () {
    try {
      var escuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-tema", escuro ? "escuro" : "claro");
      if (escuro) {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", "#0b0f14");
      }
    } catch (e) { document.documentElement.setAttribute("data-tema", "claro"); }
  })();
</script>
<style>
  :root, html[data-tema="claro"] {
    --ink: #14202e; --paper: #f4f7fb; --card: #ffffff; --line: #d9e2ee;
    --muted: #5a6b80; --warn: #b3261e;
    --azul: #14498c; --azul-claro: #2f7de0;
  }
  html[data-tema="escuro"] {
    --ink: #eef3f8; --paper: #0b0f14; --card: #161c24; --line: #2b333f;
    --muted: #9aa8ba; --warn: #ff7a6e;
    --azul: #12345f; --azul-claro: #2b6fc9;
  }
  html { color-scheme: light; }
  html[data-tema="escuro"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 440px; }
  .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: center; margin-bottom: 18px; }
  .cartao {
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-claro) 100%);
    color: white; border-radius: 16px; padding: 26px 22px; text-align: center;
    box-shadow: 0 10px 30px rgba(11,61,145,0.26);
  }
  .cartao .rotulo { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; }
  .cartao .nome { font-size: 1.15rem; font-weight: 700; margin: 4px 0 18px; word-break: break-word; }
  .cartao .saldo { font-size: 3.2rem; font-weight: 800; line-height: 1; }
  .cartao .unidade { font-size: 0.85rem; opacity: 0.85; margin-top: 6px; }


  .aviso { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 40px 10px; }
  .aviso.erro { color: var(--warn); }
  .rodape { text-align: center; color: var(--muted); font-size: 0.72rem; margin-top: 26px; }
  button { font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 9px 16px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow" id="titulo-evento">Cartão do Participante</div>

  <div id="carregando" class="aviso">Consultando seu saldo...</div>

  <div id="erro" class="aviso erro" style="display:none">
    <p id="erro-texto"></p>
    <button id="btn-repetir">Tentar de novo</button>
  </div>

  <div id="conteudo" style="display:none">
    <div class="cartao">
      <div class="rotulo">Saldo de</div>
      <div class="nome" id="nome"></div>
      <div class="saldo" id="saldo">—</div>
      <div class="unidade" id="unidade">pontos</div>
    </div>

    <div class="rodape" id="rodape-nome">Gerenciador de Evangelismo</div>
  </div>
</div>

<script>
"use strict";

function $(id) { return document.getElementById(id); }

function esc(v) {
  return String(v === null || v === undefined ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function mostrarErro(texto) {
  $("carregando").style.display = "none";
  $("conteudo").style.display = "none";
  $("erro-texto").textContent = texto;
  $("erro").style.display = "block";
}

/**
 * O QR do cartão carrega:
 *   u = identificador da implantação do Web App da planilha
 *   a = domínio Google Workspace (só quando a conta não é uma conta comum)
 *   c = código de leitura da planilha (só permite consultar saldo)
 *   p = começo do ID do participante
 * Nenhum deles abre o painel de gestão nem lista participante nenhum.
 */
function montarUrlWebApp(u, a) {
  if (!/^[A-Za-z0-9_-]+$/.test(u)) return null;
  if (a) {
    if (!/^[A-Za-z0-9.-]+$/.test(a)) return null;
    return "https://script.google.com/a/macros/" + a + "/s/" + u + "/exec";
  }
  return "https://script.google.com/macros/s/" + u + "/exec";
}

async function consultar() {
  $("erro").style.display = "none";
  $("carregando").style.display = "block";

  const q = new URLSearchParams(location.search);
  const webapp = montarUrlWebApp(q.get("u") || "", q.get("a") || "");
  const consulta = q.get("c") || "";
  const p = q.get("p") || "";

  if (!webapp || !consulta || !p) {
    mostrarErro("Este link está incompleto. Escaneie o QR Code do seu cartão outra vez.");
    return;
  }

  try {
    const res = await fetch(webapp, {
      method: "POST",
      body: JSON.stringify({ action: "consultarSaldo", consulta, p })
    });
    const json = await res.json();
    if (!json.ok) { mostrarErro(json.erro || "Não foi possível consultar seu saldo."); return; }
    render(json.dados);
  } catch (e) {
    console.error(e);
    mostrarErro("Não consegui falar com o sistema agora. Verifique sua internet e tente de novo.");
  }
}

function render(d) {
  // O nome do evangelismo é escolhido pelo cliente e vem junto com o saldo.
  // Sem ele (planilha ainda não atualizada), fica o texto antigo.
  if (d.nomeEvento) $("titulo-evento").textContent = d.nomeEvento;
  $("rodape-nome").textContent = d.nomeEvento || "Gerenciador de Evangelismo";
  $("nome").textContent = d.nome || "Participante";
  $("saldo").textContent = d.saldo;
  $("unidade").textContent = Math.abs(d.saldo) === 1 ? "ponto" : "pontos";

  $("carregando").style.display = "none";
  $("conteudo").style.display = "block";
}

$("btn-repetir").addEventListener("click", consultar);
consultar();
</script>
</body>
</html>
